<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuración de Clínica - Fysium</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="icon" type="image/png" href="favicon.ico">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/registro.css">
  <link rel="stylesheet" href="styles/login.css">
  <style>
    .counter-box {
      background-color: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      margin-bottom: 20px;
    }
    .counter-text {
      font-size: 18px;
      font-weight: bold;
      color: #166534;
    }
    .fisio-list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
      padding: 10px;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      margin-bottom: 10px;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      color: #4b5563;
      text-decoration: none;
      font-weight: bold;
      margin-bottom: 20px;
      cursor: pointer;
    }
    .back-btn:hover {
      color: #1f2937;
    }
  </style>
</head>

<body>
  <div class="login-wrapper">
    <div class="login-card" style="max-width: 500px;">
      
      <a id="btnCerrarSesion" class="back-btn">&larr; Cerrar Sesión / Volver</a>

      <div class="login-header">
        <h1>Configuración Inicial</h1>
        <p>Para completar el registro de tu clínica, debes añadir al menos 2 fisioterapeutas a tu equipo.</p>
      </div>

      <div class="counter-box">
        <div class="counter-text">Fisios actuales: <span id="fisiosCount">0</span> / 2</div>
      </div>

      <div id="errorBox" class="error-message"></div>
      <div id="successBox" class="error-message" style="display:none; background-color:#dcfce7; color:#166534; border-color:#86efac;"></div>

      <div style="background: white; padding: 20px; border-radius: 12px; border: 1px solid #e5e7eb; margin-bottom: 20px;">
        <h4 style="margin-top:0;">Añadir nuevo fisioterapeuta</h4>
        
        <form id="addFisioForm">
          <div class="form-group">
            <input type="text" id="fNombre" class="form-control" required placeholder="Nombre del fisio">
          </div>
          <div class="form-group">
            <input type="email" id="fEmail" class="form-control" required placeholder="Email del fisio">
          </div>
          <div class="form-group">
            <div class="phone-group">
              <select id="fPrefix">
                <option value="+34">+34</option>
                <option value="+1">+1</option>
                <option value="+44">+44</option>
                <option value="+33">+33</option>
                <option value="+49">+49</option>
                <option value="+351">+351</option>
                <option value="+39">+39</option>
                <option value="+52">+52</option>
                <option value="+54">+54</option>
                <option value="+57">+57</option>
                <option value="+56">+56</option>
              </select>
              <input type="tel" id="fTelefono" class="form-control" placeholder="Teléfono (Opcional)">
            </div>
          </div>
          <div class="form-group">
            <input type="password" id="fPassword" class="form-control" required placeholder="Contraseña para el Fisio">
          </div>
          
          <hr style="border: 0; border-top: 1px solid #e5e7eb; margin: 15px 0;">
          
          <div class="form-group">
            <input type="password" id="cPassword" class="form-control" required placeholder="TU Contraseña de Clínica (Confirmación)" style="border-color: #0d9488; border-width: 2px;">
          </div>

          <button type="submit" id="btnGuardarFisio" class="btn-save" style="width: 100%; padding: 12px;">Guardar Fisioterapeuta</button>
        </form>
      </div>

      <div id="fisiosListContainer" style="margin-bottom: 20px;"></div>

      <button type="button" id="btnEntrar" class="login-submit-btn" style="background-color: #ccc; cursor: not-allowed;" disabled>
        Faltan fisios para continuar
      </button>

    </div>
  </div>

  <script src="js/supabase-config.js"></script>
  <script src="js/configuracion-clinica.js"></script>
</body>

</html>
