<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>FysiumApp</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // Si la ruta pertenece a la app web (/app/...), redirigir a /app/
    var path = window.location.pathname;
    if (path.indexOf('/app') === 0) {
      window.location.replace('/app/');
    } else {
      window.location.replace('/');
    }
  </script>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f1f5f9; color: #2D5D5D;">
  <p>Cargando FysiumApp...</p>
</body>
</html>
