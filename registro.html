<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro Profesionales - Fysium</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="icon" type="image/png" href="favicon.ico">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/registro.css">
  <link rel="stylesheet" href="styles/login.css">
</head>

<body>
  <div class="login-wrapper">
    <div class="login-card" style="max-width: 500px;">
      <div class="login-header">
        <a href="index.html"><img src="assets/FysiumApp_logo.png" alt="Fysium Logo" class="login-logo"></a>
        <h1>Crear Cuenta Profesional</h1>
        <p>Únete a Fysium y digitaliza tu consulta.</p>
      </div>

      <div id="errorBox" class="error-message"></div>

      <div class="role-toggle">
        <button type="button" class="role-btn active" id="btnRoleFisio" onclick="setRole('fisio')">Soy Fisioterapeuta</button>
        <button type="button" class="role-btn" id="btnRoleClinica" onclick="setRole('clinica')">Soy Clínica</button>
      </div>

      <form id="registroForm" class="login-form">
        <div class="form-group">
          <label id="labelNombre" for="nombre">Nombre Completo</label>
          <input type="text" id="nombre" class="form-control" required placeholder="Tu nombre o el de la clínica">
        </div>

        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" class="form-control" required placeholder="tu@email.com">
        </div>

        <div class="form-group">
          <label id="labelTel1" for="telefono">Teléfono</label>
          <div class="phone-group">
            <select id="prefix1">
              <option value="+34">+34</option>
              <option value="+1">+1</option>
              <option value="+44">+44</option>
              <option value="+33">+33</option>
              <option value="+49">+49</option>
              <option value="+351">+351</option>
              <option value="+39">+39</option>
              <option value="+52">+52</option>
              <option value="+54">+54</option>
              <option value="+57">+57</option>
              <option value="+56">+56</option>
            </select>
            <input type="tel" id="telefono" class="form-control" required placeholder="600000000">
          </div>
        </div>

        <!-- Campo extra solo para clínica -->
        <div class="form-group hidden" id="groupTel2">
          <label for="telefono2">Teléfono Móvil (Opcional)</label>
          <div class="phone-group">
            <select id="prefix2">
              <option value="+34">+34</option>
              <option value="+1">+1</option>
              <option value="+44">+44</option>
              <option value="+33">+33</option>
              <option value="+49">+49</option>
              <option value="+351">+351</option>
              <option value="+39">+39</option>
              <option value="+52">+52</option>
              <option value="+54">+54</option>
              <option value="+57">+57</option>
              <option value="+56">+56</option>
            </select>
            <input type="tel" id="telefono2" class="form-control" placeholder="600000000">
          </div>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" class="form-control" required placeholder="••••••••">
        </div>



        <div class="checkbox-group">
          <input type="checkbox" id="terminos" required>
          <label for="terminos">He leído y acepto la Política de Privacidad y los Términos y Condiciones.</label>
        </div>

        <button type="submit" id="submitBtn" class="login-submit-btn">
          <span id="btnText">Registrarme</span>
          <div id="btnSpinner" class="spinner" style="display:none;"></div>
        </button>
      </form>

      <div class="login-footer">
        <p>¿Ya tienes cuenta? <a href="login.html" style="color:#0d9488; font-weight:bold;">Inicia sesión</a></p>
      </div>
    </div>
  </div>



  <script src="js/supabase-config.js"></script>
  <script src="js/registro.js"></script>
</body>

</html>
