<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuenta Confirmada - Fysium</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="favicon.ico">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/login.css">
</head>

<body>
  <div class="login-wrapper">
    <div class="login-card" style="text-align: center; padding: 40px 20px;">
      <div class="login-header">
        <!-- Logo estático sin enlace para que no puedan navegar al resto de la web -->
        <img src="assets/FysiumApp_logo.png" alt="Fysium Logo" class="login-logo" style="margin: 0 auto 20px;">

        <!-- Mensaje de éxito -->
        <h1 style="color: #2C5E50; margin-bottom: 15px;">¡Cuenta Verificada!</h1>
        <p style="font-size: 16px; line-height: 1.5; margin-bottom: 10px;">
          Tu dirección de correo electrónico ha sido confirmada con éxito.
        </p>

        <!-- Recuadro destacado instruyendo volver a la app -->
        <div style="background-color: #E8F2EF; padding: 15px; border-radius: 12px; margin-top: 25px; border: 1px solid #c2e0d6;">
          <p style="font-size: 15px; font-weight: 600; color: #1a3c32; margin: 0;">
            Ya puedes cerrar esta ventana de forma segura y volver a la app en tu móvil para iniciar sesión.
          </p>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
