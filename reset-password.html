<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva Contraseña - Fysium</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="icon" type="image/png" href="favicon.ico">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/login.css">
</head>

<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <a href="index.html">
          <img src="assets/FysiumApp_logo.png" alt="Fysium Logo" class="login-logo">
        </a>
        <h1>Nueva Contraseña</h1>
        <p>Escribe tu nueva contraseña segura.</p>
      </div>

      <div id="errorBox" class="error-message"></div>

      <form id="resetForm" class="login-form">
        <div class="form-group">
          <label for="newPassword">Nueva Contraseña</label>
          <input type="password" id="newPassword" class="form-control" required placeholder="Mínimo 6 caracteres">
        </div>

        <button type="submit" id="submitBtn" class="login-submit-btn">
          <span id="btnText">Actualizar Contraseña</span>
          <div id="btnSpinner" class="spinner" style="display: none;"></div>
        </button>
      </form>
    </div>
  </div>

  <script src="js/supabase-config.js"></script>
  <script src="js/reset-password.js"></script>
</body>

</html>
