<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Fisioterapeutas - Fysium</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="icon" type="image/png" href="favicon.ico">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/login.css">
</head>

<body>

    <div class="login-wrapper">
        <div class="login-card">

            <div class="login-header">
                <a href="index.html">
                    <img src="assets/FysiumApp_logo.png" alt="Fysium Logo" class="login-logo">
                </a>
                <h1>Acceso Profesionales</h1>
                <p>Gestiona tu agenda y tus pacientes.</p>
            </div>

            <div id="errorBox" class="error-message"></div>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" class="form-control" required placeholder="tu@email.com">
                </div>

                <div class="form-group">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <label for="password">Contraseña</label>
                        <a href="#" id="forgotPasswordBtn" style="font-size: 0.85rem; color: #0d9488; text-decoration: none;">¿Has olvidado tu contraseña?</a>
                    </div>
                    <input type="password" id="password" class="form-control" required placeholder="••••••••">
                </div>

                <button type="submit" id="submitBtn" class="login-submit-btn">
                    <span id="btnText">Entrar al Panel</span>
                    <div id="btnSpinner" class="spinner"></div>
                </button>
            </form>

            <div class="login-footer" style="margin-bottom: 15px;">
                <p>¿Aún no tienes cuenta? <a href="registro.html" style="color:#0d9488; font-weight:bold;">Regístrate gratis</a></p>
            </div>
            <div class="login-footer">
                <a href="index.html" class="back-link">
                    &larr; Volver al inicio
                </a>
            </div>

        </div>
    </div>

    <script src="js/supabase-config.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
