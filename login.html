<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Iniciar Sesión - Fysium</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="icon" type="image/png" href="favicon.ico">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/login.css?v=3">
</head>

<body>

    <div class="login-wrapper">
        <div class="login-card">

            <div class="login-header">
                <a href="index.html">
                    <img src="assets/FysiumApp_logo.png" alt="Fysium Logo" class="login-logo">
                </a>
                <h1>Iniciar Sesión</h1>
                <p>Accede a tus citas, agenda o gestión.</p>
            </div>

            <div id="errorBox" class="error-message"></div>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" class="form-control" required placeholder="tu@email.com">
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" class="form-control" required placeholder="••••••••">
                    <div class="forgot-wrapper">
                        <a href="#" id="forgotPasswordBtn" class="forgot-link">¿Has olvidado tu contraseña?</a>
                    </div>
                </div>
                <button type="submit" id="submitBtn" class="login-submit-btn">
                    <span id="btnText">Entrar</span>
                    <div id="btnSpinner" class="spinner"></div>
                </button>
            </form>
            <div class="register-prompt-section">
                <p class="register-prompt-text">¿Aún no tienes cuenta?</p>
                <div class="register-actions-row">
                    <a href="registro.html?rol=cliente" class="register-btn">
                        Soy Cliente
                    </a>
                    <a href="registro.html?rol=fisio" class="register-btn">
                        Soy Profesional o Centro
                    </a>
                </div>
            </div>
            <div class="login-back-wrapper">
                <a href="index.html" class="back-link">
                    &larr; Volver al inicio
                </a>
            </div>

        </div>
    </div>

    <script src="js/supabase-config.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
